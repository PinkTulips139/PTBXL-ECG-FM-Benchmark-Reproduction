<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">PTB-XL experiment matrix</title>
  <desc id="desc">Finetuning, Frozen, and Linear independently branch from the original pretrained checkpoint and cover all, sub, and super label spaces for 78 formal experiments.</desc>
  <rect x="1" y="1" width="1198" height="448" rx="20" fill="#f7fafb" stroke="#c8d6dc"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif">
    <text x="52" y="48" fill="#17313b" font-size="25" font-weight="720">Experiment matrix</text>
    <text x="52" y="73" fill="#5a6e77" font-size="15">Independent evaluation routes from the same pretrained authority</text>

    <rect x="52" y="154" width="248" height="112" rx="14" fill="#123743"/>
    <text x="176" y="187" text-anchor="middle" fill="#8edbd2" font-size="13" font-weight="750" letter-spacing="1.2">STARTING AUTHORITY</text>
    <text x="176" y="220" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="720">Original pretrained</text>
    <text x="176" y="246" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="720">checkpoint</text>

    <g fill="none" stroke="#587681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 210H360V123H410"/>
      <path d="M300 210H410"/>
      <path d="M300 210H360V297H410"/>
    </g>
    <g fill="#587681"><path d="M410 123l-11-6v12z"/><path d="M410 210l-11-6v12z"/><path d="M410 297l-11-6v12z"/></g>

    <g>
      <rect x="410" y="88" width="280" height="70" rx="12" fill="#dff2ef" stroke="#73b8ae"/>
      <text x="434" y="118" fill="#17313b" font-size="19" font-weight="750">Finetuning</text>
      <text x="434" y="142" fill="#4d626a" font-size="14">10 models × 3 label spaces</text>
      <text x="664" y="130" text-anchor="end" fill="#176b5a" font-size="26" font-weight="780">30</text>

      <rect x="410" y="175" width="280" height="70" rx="12" fill="#e7f0f4" stroke="#87aebd"/>
      <text x="434" y="205" fill="#17313b" font-size="19" font-weight="750">Frozen</text>
      <text x="434" y="229" fill="#4d626a" font-size="14">8 foundation models × 3</text>
      <text x="664" y="217" text-anchor="end" fill="#0b6d79" font-size="26" font-weight="780">24</text>

      <rect x="410" y="262" width="280" height="70" rx="12" fill="#e7f0f4" stroke="#87aebd"/>
      <text x="434" y="292" fill="#17313b" font-size="19" font-weight="750">Linear</text>
      <text x="434" y="316" fill="#4d626a" font-size="14">8 foundation models × 3</text>
      <text x="664" y="304" text-anchor="end" fill="#0b6d79" font-size="26" font-weight="780">24</text>
    </g>

    <g fill="none" stroke="#587681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M690 123H748V210H797"/>
      <path d="M690 210H797"/>
      <path d="M690 297H748V210H797"/>
    </g>
    <path d="M797 210l-11-6v12z" fill="#587681"/>

    <rect x="797" y="151" width="351" height="118" rx="14" fill="#ffffff" stroke="#9db1ba"/>
    <text x="972" y="184" text-anchor="middle" fill="#17313b" font-size="18" font-weight="740">Same records · same split · same test ECGs</text>
    <g fill="#0b6d79" font-size="17" font-weight="760">
      <text x="844" y="226">all · 71</text><text x="949" y="226">sub · 23</text><text x="1061" y="226">super · 5</text>
    </g>
    <text x="972" y="251" text-anchor="middle" fill="#566a73" font-size="14">Only the label space changes · N = 2,198</text>

    <rect x="52" y="373" width="1096" height="48" rx="12" fill="#eaf2f4" stroke="#c8d6dc"/>
    <text x="78" y="403" fill="#17313b" font-size="16" font-weight="720">Formal scope</text>
    <text x="213" y="403" fill="#4f646d" font-size="16">30 Finetuning + 24 Frozen + 24 Linear</text>
    <text x="1118" y="404" text-anchor="end" fill="#0b6d79" font-size="25" font-weight="800">78 total</text>
  </g>
</svg>
