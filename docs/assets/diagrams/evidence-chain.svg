<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Prediction evidence chain</title>
  <desc id="desc">Window-level predictions are linked to canonical ECG identity, target alignment, record-level mean aggregation, saved aggregate verification, Macro AUROC, and record-level Bootstrap confidence intervals.</desc>
  <rect x="1" y="1" width="1198" height="468" rx="20" fill="#f7fafb" stroke="#c8d6dc"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif">
    <text x="50" y="48" fill="#17313b" font-size="25" font-weight="720">Sample-level evidence chain</text>
    <text x="50" y="73" fill="#5a6e77" font-size="15">From stored window predictions to record-level evaluation evidence</text>

    <g fill="#ffffff" stroke="#91a9b3">
      <rect x="45" y="100" width="225" height="78" rx="12"/><rect x="340" y="100" width="225" height="78" rx="12"/>
      <rect x="635" y="100" width="225" height="78" rx="12"/><rect x="930" y="100" width="225" height="78" rx="12"/>
      <rect x="185" y="254" width="225" height="78" rx="12"/><rect x="487" y="254" width="225" height="78" rx="12"/>
      <rect x="789" y="254" width="225" height="78" rx="12"/>
    </g>

    <g fill="#0b6d79" font-size="12" font-weight="800">
      <text x="61" y="122">01</text><text x="356" y="122">02</text><text x="651" y="122">03</text><text x="946" y="122">04</text>
      <text x="201" y="276">05</text><text x="503" y="276">06</text><text x="805" y="276">07</text>
    </g>
    <g fill="#17313b" font-size="17" font-weight="720" text-anchor="middle">
      <text x="157" y="145">Window-level</text><text x="157" y="166">prediction</text>
      <text x="452" y="145">Canonical</text><text x="452" y="166">ECG ID</text>
      <text x="747" y="145">Target</text><text x="747" y="166">alignment</text>
      <text x="1042" y="145">Record-level mean</text><text x="1042" y="166">aggregation</text>
      <text x="297" y="299">Saved aggregate</text><text x="297" y="320">verification</text>
      <text x="599" y="310">Macro AUROC</text>
      <text x="901" y="299">Bootstrap</text><text x="901" y="320">95% CI</text>
    </g>

    <g fill="none" stroke="#587681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M270 139H340"/><path d="M565 139H635"/><path d="M860 139H930"/>
      <path d="M1042 178V218H297V254"/>
      <path d="M410 293H487"/><path d="M712 293H789"/>
    </g>
    <g fill="#587681">
      <path d="M340 139l-11-6v12z"/><path d="M635 139l-11-6v12z"/><path d="M930 139l-11-6v12z"/>
      <path d="M297 254l-6-11h12z"/><path d="M487 293l-11-6v12z"/><path d="M789 293l-11-6v12z"/>
    </g>

    <rect x="220" y="381" width="760" height="58" rx="12" fill="#e1f1ed" stroke="#71b5aa"/>
    <text x="600" y="406" text-anchor="middle" fill="#1c5449" font-size="17" font-weight="750">Formal evaluation and Bootstrap sampling unit = one ECG record</text>
    <text x="600" y="427" text-anchor="middle" fill="#416e66" font-size="13">Window rows are supplementary provenance; Bootstrap resamples 2,198 ECG records.</text>
  </g>
</svg>
